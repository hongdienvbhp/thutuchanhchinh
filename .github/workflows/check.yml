name: Kiểm tra preview TTHC

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v4
        with:
          node-version: '22'
      - name: Validate static entrypoints
        run: node scripts/validate-static-site.mjs
      - name: Validate canonical view and reject private Master
        run: node scripts/check-canonical-view.mjs
