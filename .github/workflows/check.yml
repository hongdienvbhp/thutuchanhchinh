name: Kiểm tra preview TTHC

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate static entrypoints
        run: node scripts/validate-static-site.mjs
      - name: Validate canonical view and reject private Master
        run: node scripts/check-canonical-view.mjs
