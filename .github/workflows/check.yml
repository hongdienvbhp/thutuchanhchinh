name: Kiểm tra preview TTHC

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'
      - name: Validate static entrypoints
        run: node scripts/validate-static-site.mjs
      - name: Validate canonical view and reject private Master
        run: node scripts/check-canonical-view.mjs
