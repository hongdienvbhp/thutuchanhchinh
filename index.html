<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục thủ tục Hành chính</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .card { 
            display: flex; 
            align-items: center; 
            background: white; 
            border-radius: 8px; 
            padding: 0; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            overflow: hidden;
            border-left: 6px solid #27ae60;
        }
        .card:hover { transform: translateX(10px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); border-left-color: #2ecc71; }
        .number-tag { 
            background: #27ae60; 
            color: white; 
            padding: 15px 20px; 
            font-weight: bold; 
            font-size: 1.2em; 
            min-width: 40px;
            text-align: center;
        }
        .btn-link { 
            text-decoration: none; 
            color: #34495e; 
            padding: 15px 20px; 
            flex-grow: 1; 
            font-weight: 600;
            display: block;
        }
        .btn-link:hover { color: #27ae60; }
    </style>
</head>
<body>
    <h1>Danh mục thủ tục hành chính trọng điểm</h1>
    <div class="container">
        <p id="canonical-loading">Đang tải dữ liệu TTHC từ nguồn canonical...</p>
    </div>
    <script type="module" src="./canonical-view.js"></script>
</body>
</html>
